dependencies:
  idf: ">=5.5.1"
  # The vendor template's pins (tanmatsu-template/main/idf_component.yml) — the supported combination for a
  # Tanmatsu app. NOTE: our unit's launcher v0.3.1 is itself built with badge-bsp 2.0.0; the template ships
  # 2.0.3 (same minor, patch release), so the CH32 coprocessor protocol still matches.
  badgeteam/badge-bsp: "=2.0.3"
  nicolaielectronics/tanmatsu-wifi: "=1.3.2"
  # Step 3a: the SX1262 lives on the C6 and is reached "remote" over esp-hosted. 0.6.0 is the
  # version already in the local component cache (the launcher itself ships against this component).
  nicolaielectronics/tanmatsu-lora: "=0.6.0"
  robotman2412/pax-gfx: "=2.2.2"
  # Step 6 (S503): JPEG tile decode for the Map page. Espressif's own component (TJpgDec based), so the
  # decoder is a supported one rather than something we maintain. The L2 uses JPEGDEC; the pack format is
  # identical, only the decoder differs per platform.
  espressif/esp_jpeg: "=1.0.5"
